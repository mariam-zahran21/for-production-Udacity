<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyNight</title>

  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/flipcard.css">
  <link rel="stylesheet" href="styles/navigationMenu.css">
  <link rel="stylesheet" href="styles/about.css">
  <link rel="stylesheet" href="styles/form.css">
</head>

<body>

  <header>
    <h1 data-cy="header">Study Night</h1>

    <nav aria-label="Main Navigation Menu" class="primary_nav_bar">
      <ul>
        <li id="homePage" data-cy="nav-home">Home</li>
        <li id="aboutPage" data-cy="nav-about">About</li>
        <li id="cardSetPage" data-cy="nav-card-sets">Card Sets</li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <div data-cy="card-set-1">
        Card Set 1
      </div>
    </section>

    <button data-cy="toggle_form">Toggle Form</button>

    <form data-cy="set_form">
      <input type="text" name="titleInput" placeholder="Set Title">
      <input type="submit" value="Create Set">
    </form>

    <form data-cy="card_form">
      <input type="text" name="termInput" placeholder="Term">
      <input type="text" name="descriptionInput" placeholder="Description">
      <input type="submit" value="Add Card">
    </form>

    <div data-cy="form-error" class="error"></div>

  </main>

  <script type="module" src="./data/data.js"></script>
  <script type="module" src="./src/index.js"></script>

</body>
</html>
